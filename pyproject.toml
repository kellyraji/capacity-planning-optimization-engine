[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-planning-optimization-engine"
version = "0.3.0"
description = "Industrial-engineering decision support for capacity forecasting, constrained expansion planning and operational risk simulation"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.2",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jupyter>=1",
  "ipykernel>=6",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
